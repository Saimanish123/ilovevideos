name: CI

# Markdown-only and agent-config-only changes skip CI; docs.yml lints them instead.
# Pull requests run a Playwright smoke test; pushes to main, the weekly run and a
# manual run (Actions tab, "Run workflow") run the full suite on all three browsers.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", ".claude/**"]
  pull_request:
    paths-ignore: ["**/*.md", ".claude/**"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_NAME: ilovevideos

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests check outputs against the system ffmpeg and ffprobe, and expect the
      # same major version as development (9.0); Ubuntu's apt package is 6.1.
      - name: Install ffmpeg 9.0
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$(echo "$RUNNER_TEMP"/ffmpeg-n9.0-*/bin)" >> "$GITHUB_PATH"
      - run: ffmpeg -version | head -1
      - run: pnpm check
      - name: Audit runtime dependencies (high severity blocks)
        run: pnpm audit --prod --audit-level high

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 3
          include-hidden-files: true

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests check outputs against the system ffmpeg and ffprobe, and expect the
      # same major version as development (9.0); Ubuntu's apt package is 6.1.
      - name: Install ffmpeg 9.0
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$(echo "$RUNNER_TEMP"/ffmpeg-n9.0-*/bin)" >> "$GITHUB_PATH"
      - run: ffmpeg -version | head -1
      - name: Install browsers
        run: pnpm exec playwright install --with-deps ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium webkit' }}
      - name: Smoke test (every tool page end to end, desktop Chromium)
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright test tests/e2e/every-page.spec.ts --project=chromium
      - name: Full suite (Chromium, mobile Chrome, mobile Safari)
        if: github.event_name != 'pull_request'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Budgets in lighthouserc.cjs come from README.md (design principles §5, architecture §6).
      - run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
