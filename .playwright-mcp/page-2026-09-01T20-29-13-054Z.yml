          - heading "Frequently asked questions" [level=2] [ref=f23e813]
          - generic [ref=f23e815]:
            - button "How is usage measured?" [ref=f23e816] [cursor=pointer]:
              - generic [ref=f23e821]: Usage is measured by counting pageviews to a website plus any custom events or custom event properties stored. Each website pageview counts as one event. If you save event properties, each data property stored counts as one event.
            - button "What happens if I exceed my event limit?" [ref=f23e822] [cursor=pointer]:
              - generic [ref=f23e827]: If you exceed the events included in your plan, additional events are billed at a per-event rate. Your data collection will not be interrupted and you won't lose any data. You can monitor your usage at any time from your Umami Cloud dashboard.
            - button "How does the free trial work?" [ref=f23e828] [cursor=pointer]:
              - generic [ref=f23e833]: Umami Cloud's free trial will last for 14 days from the purchase date. The trial gives you full access to all features in that plan. At the end of the trial, you will be billed the regular amount. You can cancel your trial at any time within the trial period for no cost.
            - button "How will I be billed?" [ref=f23e834] [cursor=pointer]:
              - generic [ref=f23e839]: Billing occurs on a monthly basis and you can cancel at any time. If you upgraded to a paid plan via a trial, your first invoice will arrive after your trial period ends.
            - button "Can I change or cancel my plan at any time?" [ref=f23e840] [cursor=pointer]:
              - generic [ref=f23e845]: Yes, you can upgrade, downgrade, or cancel your plan at any time from your account settings. Changes take effect on your next billing cycle. There are no long-term contracts or cancellation fees.
            - button "Can I export my data?" [ref=f23e846] [cursor=pointer]:
              - generic [ref=f23e851]: Yes, all of your data can be exported from Umami Cloud. You have full ownership of your data at all times. Export your analytics via the API or the dashboard to use in your own tools, reports, or data warehouse. There is no vendor lock-in — if you ever decide to leave, your data goes with you.
            - button "Is Umami GDPR compliant?" [ref=f23e852] [cursor=pointer]:
              - generic [ref=f23e857]: Yes, Umami is fully GDPR and CCPA compliant. Umami does not use cookies, does not collect personal data, and does not track users across websites. All data is anonymized, so you can use Umami without needing to display a cookie consent banner.
            - button "Where are your servers located?" [ref=f23e858] [cursor=pointer]:
              - generic [ref=f23e863]: Umami Cloud servers are located in the US and EU and adhere to GDPR and CCPA regulations.
            - button "Do I need a cookie consent banner with Umami?" [ref=f23e864] [cursor=pointer]:
              - generic [ref=f23e869]: No. Umami does not use cookies or collect any personally identifiable information. This means you can use Umami without a cookie consent banner, resulting in a better experience for your visitors and more accurate analytics since no visitors are missed due to declined consent.
            - button "What's the difference between Umami Cloud and self-hosting?" [ref=f23e870] [cursor=pointer]:
              - generic [ref=f23e875]: Umami is open-source and can be self-hosted for free. Umami Cloud is our managed hosting service that handles infrastructure, updates, and maintenance for you. Cloud also includes additional features like email reports and the streaming API that are not available in the self-hosted version.
          - generic [ref=f23e876]:
            - generic [ref=f23e877]: Try Umami now.
            - link "Get started for free" [ref=f23e879] [cursor=pointer]:
              - /url: https://cloud.umami.is/signup?ref=umami-get-started-banner
