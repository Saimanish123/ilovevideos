      - heading "How long are my projects stored?" [level=1] [ref=f93e29]
    - article [ref=f93e31]:
      - generic [ref=f93e34]:
        - paragraph [ref=f93e35]: Registered users can store their projects for a specified period of time, depending on the plan.
        - paragraph [ref=f93e36]: The Clideo website stores projects created with any Clideo online tools (except for converter tools) as well as synchronized projects from the iOS Video Editor app.
        - paragraph [ref=f93e37]: The iOS Video Editor app only stores projects created in the Video Editor (web or iOS).
        - heading "Storage period" [level=2] [ref=f93e38]
        - list [ref=f93e39]:
          - listitem [level=1] [ref=f93e40]:
            - strong [ref=f93e41]: Free
            - text: registered users without a subscription have access to the projects created within the last
            - strong [ref=f93e42]: 14 days
            - text: . Projects that were created outside this time frame are locked.
          - listitem [level=1] [ref=f93e43]:
            - strong [ref=f93e44]: Premium
            - text: users with a subscription have
            - strong [ref=f93e45]: unlimited
            - text: access to their projects as long as their subscription is active.
        - heading "Storage after the end of subscription" [level=2] [ref=f93e46]
        - paragraph [ref=f93e47]: After the last day of the canceled subscription, projects older than 14 days become locked.
        - paragraph [ref=f93e48]: You have a 30-day grace period to renew your subscription and regain access to your projects. If you don’t renew within those 30 days, starting on day 31, you'll only have access to projects created or edited within the last 14 days.
        - paragraph [ref=f93e49]:
          - text: Please note that we
          - strong [ref=f93e51]: cannot guarantee
          - text: the availability of your older projects, as we are
          - strong [ref=f93e53]: not a cloud storage service
          - text: . To avoid losing your work, we strongly recommend
          - strong [ref=f93e55]: downloading your projects
          - text: once they are completed.
      - generic [ref=f93e56]:
