      - generic [ref=f1e411]:
        - heading "FAQ" [level=2] [ref=f1e412]
        - generic [ref=f1e413]:
          - heading "What is the difference between a subscription plan and a Pay As You Go package?" [level=3] [ref=f1e414]
          - generic [ref=f1e415]: A subscription plan renews your Credits every month until you cancel it. Unused Credits are not rolled over to the next month, but they are up to 50% cheaper than Pay As You Go packages. You can choose to pay monthly or yearly. A yearly subscription plan gives you an additional discount of up to 20%. Pay As You Go packages are one-time payments. Credits roll over to the next month and expire one year after payment.
        - generic [ref=f1e416]:
          - heading "How do I cancel subscription plans?" [level=3] [ref=f1e417]
          - generic [ref=f1e418]:
            - text: You can cancel your subscription plan at any time. There is no minimum contract duration. Just go to the user dashboard, click on
            - link "“Active subscriptions”" [ref=f1e419] [cursor=pointer]:
              - /url: "#"
            - text: and click “Cancel”. The plan will stop and you will not be billed anymore. However, you can use the remaining Credits until the end of your current payment period.
        - generic [ref=f1e420]:
          - heading "Can I combine a subscription plan and a Pay As You Go package?" [level=3] [ref=f1e421]
          - text: Yes. If you have a subscription plan and a Pay As You Go package, the Credits from your subscription plan will be used first. If you run out of Credits from your subscription plan, your Pay As You Go package will be used as a backup so you can continue working without interruption.
        - generic [ref=f1e422]:
          - heading "Is there a free trial available?" [level=3] [ref=f1e423]
          - text: Yes. Create a free account by signing up and you get a small number of Credits to test most features.
        - generic [ref=f1e424]:
          - heading "Is bulk licensing available?" [level=3] [ref=f1e425]
          - text: Yes. Credits can be shared through the team feature, managed by the team owner. By creating a team and purchasing Credits, the team owner can allow invited members to access and use the shared Credits. This method provides substantial savings compared to buying individual licenses for each user or seat.
        - generic [ref=f1e426]:
          - heading "Is the checkout secure?" [level=3] [ref=f1e427]
          - text: We use PayPal and Stripe as our payment providers, both well-known companies. They are fully compliant with the Payment Card Industry Data Security Standard (PCI DSS). When you make a purchase, you are actually paying them and they pay us after handling compliance. We are only informed that you paid. This way we never get your full credit card number, only the last 4 digits.
        - generic [ref=f1e428]:
          - heading "How many Credits does a task cost?" [level=3] [ref=f1e429]
          - generic [ref=f1e430]: It depends. We charge based on the processing power needed for your task. This way, you only pay for what you actually use, which usually results in a better price-performance ratio. On the other hand, we cannot calculate the total amount of Credits needed beforehand. But on every feature page, right next to the “Start” button, there is a yellow button showing how much you get for one Credit. To understand how many Credits are needed, you can also try us during the free trial period with our sample files or your own files. After the task has finished you can clearly see the Credits used in your task history.
        - generic [ref=f1e431]:
          - heading "Are there any discounts?" [level=3] [ref=f1e432]
          - generic [ref=f1e433]:
            - text: We know that our product prices do not fit into everybody's budget. Therefore we have introduced the
            - link "educational program" [ref=f1e434] [cursor=pointer]:
              - /url: https://www.online-convert.com/solution/education
            - text: where we support teachers and students. Also, our free trial is for an unlimited time and the test Credits renew every 24 hours. We ask you to use this opportunity responsibly, since we also need to pay our bills and want to continue improving the project daily.
        - generic [ref=f1e435]:
          - heading "Which payment methods do you accept?" [level=3] [ref=f1e436]
          - text: We currently support most credit cards and PayPal.
        - generic [ref=f1e437]:
          - heading "Can I get a refund?" [level=3] [ref=f1e438]
          - text: It depends. We offer a 14-day money-back guarantee if you are not satisfied with the product and have not used it extensively. Just contact our support.
