    - article [ref=f94e31]:
      - generic [ref=f94e34]:
        - paragraph [ref=f94e35]: Clideo offers several access options so you can use the tools in the way that best suits your needs.
        - heading "Access levels" [level=2] [ref=f94e36]
        - paragraph [ref=f94e37]: "You can use Clideo tools in the following ways:"
        - list [ref=f94e38]:
          - listitem [ref=f94e39]:
            - strong [ref=f94e40]: Visitor
            - text: — Free access without registration.
          - listitem [ref=f94e41]:
            - strong [ref=f94e42]: Registered user
            - text: — Free access with a Clideo account.
          - listitem [ref=f94e43]:
            - strong [ref=f94e44]: Premium user
            - text: — Access with a paid Clideo Pro plan (monthly or annual).
        - paragraph [ref=f94e45]:
          - text: Each access level has its own usage limitations. For details on what’s included, see the article about
          - link "usage limitations" [ref=f94e46] [cursor=pointer]:
            - /url: /hc/en-us/articles/4412770604562
          - text: for different types of users.
        - heading "Clideo Pro plan" [level=2] [ref=f94e47]
        - paragraph [ref=f94e48]: "A Clideo Pro plan gives you full access to the following Clideo tools and apps:"
        - list [ref=f94e49]:
          - listitem [ref=f94e50]:
            - link "Clideo Video Editor" [ref=f94e51] [cursor=pointer]:
              - /url: https://clideo.com/video-editor
            - text: (web version)
          - listitem [ref=f94e52]:
            - link "Clideo Video Editor for iOS" [ref=f94e53] [cursor=pointer]:
              - /url: https://apps.apple.com/us/app/clideo-video-editor/id1552262611
          - listitem [ref=f94e54]:
            - link "Online Clideo tools" [ref=f94e55] [cursor=pointer]:
              - /url: https://clideo.com/tools
        - paragraph [ref=f94e56]: "You can choose between two subscription options:"
        - list [ref=f94e57]:
          - listitem [ref=f94e58]: Monthly plan — Billed each month.
          - listitem [ref=f94e59]: Annual plan — Billed once per year.
        - paragraph [ref=f94e60]:
          - text: The subscription does not expire and will renew automatically unless you stop it. You can
          - link "cancel your subscription" [ref=f94e61] [cursor=pointer]:
            - /url: /hc/en-us/articles/4414015283346
          - text: at any time to prevent future charges.
        - paragraph [ref=f94e62]:
          - text: Check plan details and terms on the
          - link "Pricing page" [ref=f94e63] [cursor=pointer]:
            - /url: https://clideo.com/pricing
          - text: .
