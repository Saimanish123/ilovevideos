        - generic [ref=f79e505]:
          - generic [ref=f79e506]:
            - heading "What are conversion credits?" [level=3] [ref=f79e507]
            - generic [ref=f79e508]:
              - paragraph [ref=f79e510]:
                - text: The longer a conversion takes, the more resources it consumes and the more expensive it becomes. Our packages and subscriptions typically consume
                - strong [ref=f79e511]: one credit per minute of conversion time
                - text: .Depending on the conversion type, each conversion also has
                - strong [ref=f79e512]: a base credit cost
                - text: . By default, conversions consume
                - strong [ref=f79e513]: at least one credit
                - text: ", with additional credits charged for every extra minute if the conversion takes longer than one minute. We also offer a few"
                - strong [ref=f79e514]: premium conversion types
                - text: that require more resources and therefore have a minimum base cost of two credits. Of course, only successful conversions are charged.
              - generic [ref=f79e515]:
                - table [ref=f79e516]:
                  - rowgroup [ref=f79e517]:
                    - row [ref=f79e518]:
                      - columnheader "Conversion Type" [ref=f79e519]
                      - columnheader "Base Credits" [ref=f79e520]
                  - rowgroup [ref=f79e521]:
                    - row [ref=f79e522]:
                      - cell "General" [ref=f79e523]
                      - cell "1" [ref=f79e524]
                    - row [ref=f79e525]:
                      - cell "Office to PDF" [ref=f79e526]
                      - cell "2" [ref=f79e527]
                    - row [ref=f79e528]:
                      - cell "iWork to PDF" [ref=f79e529]
                      - cell "2" [ref=f79e530]
                    - row [ref=f79e531]:
                      - cell "PDF to Office" [ref=f79e532]
                      - cell "4" [ref=f79e533]
                - button "Credits Calculator" [ref=f79e534]
          - generic [ref=f79e538]:
            - heading "Why do I have to pay for a base amount of credits per conversion?" [level=3] [ref=f79e539]
            - paragraph [ref=f79e542]: Ninety-five percent of our conversions take only a few seconds, and we already account for that. To make costs more predictable, our pricing is based on a combination of the minimum credits consumed per conversion type and the total conversion time.
          - generic [ref=f79e543]:
            - heading "What is the difference between a package and a subscription?" [level=3] [ref=f79e544]
            - paragraph [ref=f79e547]:
              - strong [ref=f79e548]: Packages
              - text: are one-time purchases — your credits never expire and you can use them whenever you like ("pay as you go").
              - strong [ref=f79e549]: Subscriptions
              - text: charge a monthly fee for a fixed amount of credits at a lower per-credit price, but unused credits
              - strong [ref=f79e550]: do not roll over
              - text: at the end of the month. Subscriptions can be up to 50% cheaper than packages.
          - generic [ref=f79e551]:
            - heading "Can I combine packages and subscriptions?" [level=3] [ref=f79e552]
            - paragraph [ref=f79e555]: Yes! Your credits from your monthly subscription will be consumed first, and then your package credits will be consumed.
          - generic [ref=f79e556]:
            - heading "How can I make sure my account never runs out of credits?" [level=3] [ref=f79e557]
            - paragraph [ref=f79e560]:
              - text: An
              - strong [ref=f79e561]: auto-refill
              - text: option is available for packages. When enabled, your account is automatically refilled as soon as it runs out of credits. You can activate it in the
              - link "billing settings" [ref=f79e562] [cursor=pointer]:
                - /url: /settings/billing/plan
              - text: .
          - generic [ref=f79e563]:
            - heading "Can I share my package/subscription with multiple accounts?" [level=3] [ref=f79e564]
            - paragraph [ref=f79e567]: Yes. Team billing is available, so organizations such as companies or schools can use one central billing account with unlimited team members. Only billing is shared across accounts; files and conversions remain private.
          - generic [ref=f79e568]:
            - heading "When can I cancel/change my subscription?" [level=3] [ref=f79e569]
            - paragraph [ref=f79e572]: You can cancel your subscription at any time. There is no minimum term. You can also switch to a different subscription at any time, but any remaining conversion credits will expire.
          - generic [ref=f79e573]:
            - heading "Which payment methods are available?" [level=3] [ref=f79e574]
            - paragraph [ref=f79e577]: We accept all major credit cards including Visa, MasterCard, and American Express.
        - generic [ref=f79e579]:
          - heading "Ready to get started?" [level=2] [ref=f79e580]
          - paragraph [ref=f79e581]: Start free with 10 conversions per day. No credit card required.
          - generic [ref=f79e582]:
