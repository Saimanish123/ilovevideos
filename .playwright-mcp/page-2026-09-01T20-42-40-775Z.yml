            - /url: /hc/en-us/categories/4408670641426-General#4412765480082
      - heading "Are my uploaded files safe?" [level=1] [ref=f240e29]
    - article [ref=f240e31]:
      - generic [ref=f240e34]:
        - paragraph [ref=f240e35]: The safety of your data and personal information is essential to us.
        - paragraph [ref=f240e36]: Clideo uses all the required protections to keep your data safe from when you open Clideo tools and upload your files until you download the edited file to your device or cloud storage.
        - heading "Data Protection" [level=2] [ref=f240e37]
        - paragraph [ref=f240e38]: Our infrastructure is based in Germany and is fully compliant with the EU General Data Protection Regulation (GDPR).
        - heading "Certified Datacenters" [level=2] [ref=f240e39]
        - paragraph [ref=f240e40]: Clideo uses only trusted and highly secure cloud service providers and data centers, all of them are certified with ISO 27001 (Information Security Standard).
        - heading "Personal Information" [level=2] [ref=f240e41]
        - paragraph [ref=f240e42]: You can use Clideo free of charge and you don't have to share your personal information.
        - paragraph [ref=f240e43]: If you decide to register an account, we guarantee that your email address and any personal information will not be subject to sale or lease for personal or commercial purposes.
        - heading "Privacy" [level=2] [ref=f240e44]
        - paragraph [ref=f240e45]: The Clideo team does not have access to your files, and they are never public. Your files are only available in your profile if you are a registered or premium user or bound to IP address if you choose not to register.
        - heading "Secure Communication" [level=2] [ref=f240e46]
        - paragraph [ref=f240e47]: Your data is protected from being stolen, altered, or diverted because all the communications in-between your web browser, our server, and conversion hosts are performed via a secured channel protected with state-of-the-art TLS encryption and with HSTS web security policy enabled.
        - heading "Copyright" [level=2] [ref=f240e48]
        - paragraph [ref=f240e49]: You are solely responsible for your content. Clideo does not add or remove the copyright for the files processed in Clideo tools.
        - paragraph [ref=f240e50]: Make sure you have the necessary permission and authority to use content that can be copyrighted or subject to third-party proprietary rights.
        - paragraph [ref=f240e51]:
          - text: Read more about our
          - link "Privacy Policy" [ref=f240e52] [cursor=pointer]:
            - /url: https://clideo.com/privacy
