    - generic [ref=f241e75]:
      - heading "General provisions" [level=2] [ref=f241e76]
      - paragraph [ref=f241e77]:
        - text: "This Privacy Policy governs the collection, use and storage of information (hereinafter: Information) and any data (hereinafter: Data) obtained through your use of our website available at"
        - link "123apps.com" [ref=f241e78] [cursor=pointer]:
          - /url: https://123apps.com
        - text: "(hereinafter: Site) and any service available on the Site (hereinafter: Services). We do not sell, rent or otherwise make available Information or Data to third-parties. We use collected Information and Data for our internal purposes and as necessary by the nature of the Services. In some instances, we are obliged to comply with court orders and government requests and provide Information or parts of it to authorized bodies. We may disclose or access Information whenever we believe in good faith that the law so requires, such as to comply with a litigation, or that disclosure is necessary to protect our rights, protect your safety or the safety of others, investigate fraud, or if we otherwise consider it necessary to do so to maintain service and improve our products and services. The Information on users is divided into personally identifiable and non-personally identifiable Information depending on whether Information can identify the user as a specific person."
      - paragraph [ref=f241e79]: This policy is effective from 16 May 2022.
      - heading "Changes to the Privacy Policy" [level=2] [ref=f241e80]
      - paragraph [ref=f241e81]: We reserve the right to change our Privacy Policy at any time without prior notification. The current version of Privacy Policy is available on the Site, indicating the effective date. You are encouraged to periodically check our Privacy Policy.
      - heading "Consent" [level=2] [ref=f241e82]
      - paragraph [ref=f241e83]: By accessing the Site you agree to have your Information and Data handled as described in this Privacy Policy. The services are intended for a general audience and are not targeted at children.
      - heading "Personally identifiable information" [level=2] [ref=f241e84]
      - paragraph [ref=f241e85]: No registration is necessary for the use of our Services. We do not collect any personally identifiable information, your IP address, or any other Information which either alone or in connection with other data can be used to identify you.
      - paragraph [ref=f241e86]: If you send an e-mail to our e-mail address indicated on the Site, we may keep records of such communication and any question, complaint or compliment made by you and the response if any. Whenever you contact us, we will only use your e-mail address in order to provide the response, if any. We do not store your e-mail address nor use it for any other purpose.
      - paragraph [ref=f241e87]: We endeavor to maintain appropriate physical, procedural and technical security with respect to the collected information so as to prevent any loss, misuse, unauthorized access, disclosure, or modification of personal information which also applies to our disposal or destruction of personal information. Our Site uses SSL encryption in order to provide additional security of your information.
      - heading "Non-personally identifiable information and data" [level=2] [ref=f241e88]
      - paragraph [ref=f241e89]: During your use of our Service, you may provide us with Non-Personally Identifiable Information and Data as necessary by the nature of the Service. You can either upload Data on your own or use Cloud Providers (Google Drive or Dropbox) to upload your Data from cloud storage.
      - paragraph [ref=f241e90]: We use such Information and Data only for the purpose of providing you with the Service requested and to improve the user experience. We do not monitor or access the Data provided by you. Processing of the Information and Data is completely automated without any human interaction or supervision.
      - paragraph [ref=f241e91]: If you choose to upload your Data through the Cloud Providers, you are giving us permission to access and to view, download and interact with such Data. We are only interacting with the Data in a way that is strictly necessary by the nature of the requested Service. We do not access, collect, use or store any Data or Information that is not necessary to provide you with the Service requested.
      - paragraph [ref=f241e92]: Any Data which you provide for the purpose of utilizing our Services is stored on our servers only for as long as necessary, and is deleted automatically no later than twelve (12) hours from the moment you complete your use of our Services.
      - heading "Cookies" [level=2] [ref=f241e93]
      - paragraph [ref=f241e94]: Cookies help us optimize and improve the user experience of the Site by helping us deliver crucial functionalities. The cookies we use may vary over time as we continuously update and improve our Site.
      - paragraph [ref=f241e95]:
        - text: Third party applications that we use, such as Dropbox, Google Drive, Google Analytics, Google DoubleClick, and Google Adsense do use cookies on our site to help analyse the web traffic or determine targeted advertisements based on your preferences. To opt out of Google’s use of cookies, please visit the Google ad and content network privacy policy. If you prefer not to use cookies at all, we recommend adjusting your browser settings accordingly. If you are unsure how to do that, use your favorite search engine to find out everything about it or visit
        - link "cookiesandyou.com" [ref=f241e96] [cursor=pointer]:
          - /url: https://cookiesandyou.com/
        - text: .
      - heading "Use of your information" [level=2] [ref=f241e97]
      - paragraph [ref=f241e98]: We use your information in order to deliver our Services, to analyze the use of the Site, and the Services, to develop new products or services, optimize content, to provide support and to deliver ads based on your preferences. Processing of the Information and Data is automated and done without any supervision or interference by the physical person.
      - paragraph [ref=f241e99]: Your information is processed and handled in accordance with applicable laws and with your further consent where necessary.
      - paragraph [ref=f241e100]: Third-party service providers may use your information for ads placement and notifications. We do not encourage, support or endorse any ad that is placed on the Site. We have provided you with the full list of third-party services we are using in order to help you understand how your information is handled and you are encouraged to visit their respective privacy policies in order to exercise your right to the control of your personal information.
      - heading "Data deletion" [level=2] [ref=f241e101]
      - paragraph [ref=f241e102]:
        - text: To submit a data data deletion request, please contact us at
        - link "support@123apps.com" [ref=f241e103] [cursor=pointer]:
          - /url: mailto:support@123apps.com
        - text: . Please include as much information as possible regarding which data you would like to be deleted.
      - heading "Contact information" [level=2] [ref=f241e104]
      - paragraph [ref=f241e105]:
        - text: If you have any questions regarding our Privacy Policy and how the information is handled, or you wish to access, amend, or update your information feel free to contact us at
        - link "support@123apps.com" [ref=f241e106] [cursor=pointer]:
          - /url: mailto:support@123apps.com
        - text: .
