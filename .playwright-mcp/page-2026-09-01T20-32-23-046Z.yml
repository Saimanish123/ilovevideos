            - /url: /hc/en-us/categories/4408670641426-General#4412765480082
      - heading "Are there any usage limitations?" [level=1] [ref=f70e29]
    - article [ref=f70e31]:
      - generic [ref=f70e34]:
        - paragraph [ref=f70e35]: "You can use Clideo in three ways:"
        - list [ref=f70e36]:
          - listitem [ref=f70e37]:
            - strong [ref=f70e38]: Visitor
            - text: — free access without registration
          - listitem [ref=f70e39]:
            - strong [ref=f70e40]: Registered user
            - text: — free access with a Clideo account
          - listitem [ref=f70e41]:
            - strong [ref=f70e42]: Premium user
            - text: — access with a paid Clideo Pro plan
        - paragraph [ref=f70e43]: Available features and usage limits depend on your access type.
        - heading "Watermark" [level=2] [ref=f70e44]
        - list [ref=f70e45]:
          - listitem [ref=f70e46]:
            - strong [ref=f70e47]: "Visitors and registered users:"
            - text: Exported video and image files include a small Clideo watermark in the bottom-right corner.
          - listitem [ref=f70e48]:
            - strong [ref=f70e49]: "Premium users:"
            - text: No watermark is added.
        - heading "Upload size" [level=2] [ref=f70e50]
        - list [ref=f70e51]:
          - listitem [ref=f70e52]:
            - strong [ref=f70e53]: "Visitors and registered users:"
            - text: Up to
            - strong [ref=f70e54]: 500 MB
            - text: per file.
          - listitem [ref=f70e55]:
            - strong [ref=f70e56]: "Premium users:"
            - text: Up to
            - strong [ref=f70e57]: 100 GB
            - text: per file.
        - heading "File processing speed" [level=2] [ref=f70e58]
        - list [ref=f70e59]:
          - listitem [ref=f70e60]:
            - strong [ref=f70e61]: "Visitors and registered users:"
            - text: Standard.
          - listitem [ref=f70e62]:
            - strong [ref=f70e63]: "Premium users:"
            - text: Highest.
        - paragraph [ref=f70e64]: Processing speed also depends on a wide variety of factors, including file size, resolution, duration, and output format.
        - heading "Continue in" [level=2] [ref=f70e65]
        - paragraph [ref=f70e66]:
          - text: The
          - strong [ref=f70e67]: Continue in
          - text: feature lets you keep editing a file in another Clideo web tool.
        - list [ref=f70e68]:
          - listitem [ref=f70e69]:
            - strong [ref=f70e70]: "Visitors and registered users:"
            - text: Not available. To continue editing in another tool, you need to export the file first and then upload it again.
          - listitem [ref=f70e71]:
            - strong [ref=f70e72]: "Premium users:"
            - text: Available. After export, you can continue editing the project in another Clideo tool.
        - heading "AI-powered features" [level=2] [ref=f70e73]
        - paragraph [ref=f70e74]:
          - text: AI-powered features, such as AI Agent, AI generation, automatic subtitle generation, transcription, and translation, require credits. Read more about
          - link "how credits work" [ref=f70e75] [cursor=pointer]:
            - /url: https://help.clideo.com/hc/en-us/articles/27594566356252
          - text: and
          - link "AI agent limits and credits usage" [ref=f70e76] [cursor=pointer]:
            - /url: /hc/en-us/articles/29180537784732
          - text: .
        - list [ref=f70e77]:
          - listitem [ref=f70e78]:
            - strong [ref=f70e79]: "Visitors:"
            - text: Not available.
          - listitem [ref=f70e80]:
            - strong [ref=f70e81]: "Registered users:"
            - text: Available with 10 credits per month.
          - listitem [ref=f70e82]:
            - strong [ref=f70e83]: "Premium users:"
            - text: Available starting with 500 credits per month, with the option to choose a higher credit tier if needed.
        - heading "Text-to-speech (TTS)" [level=2] [ref=f70e84]
        - list [ref=f70e85]:
          - listitem [ref=f70e86]:
            - strong [ref=f70e87]: "All users:"
            - text: Text-to-speech is available under fair usage rules.
          - listitem [ref=f70e88]:
            - text: Each TTS track can contain up to
            - strong [ref=f70e89]: 500 characters
            - text: .
        - heading "Export settings" [level=2] [ref=f70e90]
        - list [ref=f70e91]:
          - listitem [ref=f70e92]:
            - strong [ref=f70e93]: "Visitors and registered users:"
            - text: 480p (Standard quality), 720p (Standard quality), GIF.
          - listitem [ref=f70e94]:
            - strong [ref=f70e95]: "Premium users:"
            - text: 480p (Standard quality), 720p (Standard quality), 1080p (High quality, FHD), 2160p (High quality, 4K), GIF.
        - heading "Recording" [level=2] [ref=f70e96]
        - list [ref=f70e97]:
          - listitem [ref=f70e98]:
            - strong [ref=f70e99]: "Visitors and registered users:"
            - text: Up to
            - strong [ref=f70e100]: 15 minutes
            - text: per recording session.
          - listitem [ref=f70e101]:
            - strong [ref=f70e102]: "Premium users:"
            - text: Up to
            - strong [ref=f70e103]: 60 minutes
            - text: per recording session.
        - heading "Project storage" [level=2] [ref=f70e104]
        - list [ref=f70e105]:
          - listitem [ref=f70e106]:
            - strong [ref=f70e107]: "Visitors:"
            - text: Projects are not stored.
          - listitem [ref=f70e108]:
            - strong [ref=f70e109]: "Registered users and premium users:"
            - text: Projects are stored in your account for a
            - link "specified period of time" [ref=f70e110] [cursor=pointer]:
              - /url: /hc/en-us/articles/4414003828882
            - strong [ref=f70e111]: .
