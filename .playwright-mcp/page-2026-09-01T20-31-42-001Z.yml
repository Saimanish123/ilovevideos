    - heading "Marketing" [level=4] [ref=f19e274]
    - paragraph [ref=f19e276]: We may use your Identity, Contact, Technical, Usage and Profile Data to form a view on what we think you may want or need, or what may be of interest to you. This is how we decide which services and offers may be relevant for you (we call this marketing). You will receive marketing communications from us if you have requested information from us or purchased from us and you have not opted out of receiving marketing.
    - generic [ref=f19e277]:
      - heading "Third-party marketing" [level=4] [ref=f19e278]
      - paragraph [ref=f19e279]: We will get your express consent before we share your personal data with any third party for their own marketing purposes.
    - generic [ref=f19e280]:
      - heading "Opting out" [level=4] [ref=f19e281]
      - paragraph [ref=f19e282]: You can ask us or third parties to stop sending you marketing messages at any time by following the opt-out links on any marketing message sent to you (where such links are available) or by contacting us at any time. Where you opt out of receiving these marketing messages, this will not apply to personal data provided to us as a result of a service purchase, service experience or other transactions.
    - generic [ref=f19e283]:
      - heading "Cookies" [level=4] [ref=f19e284]
      - paragraph [ref=f19e285]:
        - text: You can set your browser to refuse all or some browser cookies, or to alert you when websites set or access cookies. If you disable or refuse cookies, please note that some parts of the Applications may become inaccessible or not function properly. For more information about the cookies we use, please see
        - link [ref=f19e286] [cursor=pointer]:
          - /url: /cookie-policy
          - emphasis [ref=f19e287]: Cookie Policy.
    - generic [ref=f19e288]:
      - heading "Change of purpose" [level=4] [ref=f19e289]
      - paragraph [ref=f19e290]: We will only use your personal data for the purposes for which we collected it, unless we reasonably consider that we need to use it for another reason and that reason is compatible with the original purpose. If you wish to get an explanation as to how the processing for the new purpose is compatible with the original purpose, please contact us. If we need to use your personal data for an unrelated purpose, we will notify you and we will explain the legal basis which allows us to do so.Please note that we may process your personal data without your knowledge or consent, in compliance with the above rules, where this is required or permitted by law.
    - generic [ref=f19e291]:
      - heading "Automated decision-making" [level=4] [ref=f19e292]
      - paragraph [ref=f19e293]: Automated decisions are made by technological means, mostly based on algorithms subject to predefined criteria. Such automated decision-making, taken solely by technological means without any human intervention, may have legal effects or similarly significant effects on you. By using the Applications and/or our services, you are giving us your explicit consent to make automated decisions. If you do not consent to our making automated decisions, you must not use our Applications or services. The Applications may use your personal data decisions entirely or partially based on automated processes according to the purposes outlined in this privacy policy. The Applications adopt automated decision-making processes as far as necessary to enter into or perform a contract between you and us, or on the basis of your consent where consent is required by the law.
      - generic [ref=f19e294]:
        - paragraph [ref=f19e295]: "The rationale behind the automated decision-making is:"
        - list [ref=f19e296]:
          - listitem [ref=f19e297]:
            - paragraph [ref=f19e298]: so that we can suggest certain settings or tips when you use our services;
          - listitem [ref=f19e299]:
            - paragraph [ref=f19e300]: to enable or otherwise improve the decision-making process;
          - listitem [ref=f19e301]:
            - paragraph [ref=f19e302]: to grant you fair and unbiased treatment based on consistent and uniform criteria;
          - listitem [ref=f19e303]:
            - paragraph [ref=f19e304]: to reduce the potential harm derived from human error, personal bias and the like which may potentially lead to discrimination or imbalance in the treatment of individuals etc.; or
          - listitem [ref=f19e305]:
            - paragraph [ref=f19e306]: to reduce the risk of your failure to meet your obligation under your contract with us.
    - generic [ref=f19e307]:
      - heading "Your rights as a result of automated decision-making" [level=4] [ref=f19e308]
      - paragraph [ref=f19e309]: Where you are subject to automated decision-making processes, you are entitled to exercise specific rights aimed at preventing or otherwise limiting the potential effects of the automated decisions taken.
      - generic [ref=f19e310]:
        - paragraph [ref=f19e311]: "In particular, you would have the right to:"
        - list [ref=f19e312]:
          - listitem [ref=f19e313]:
            - paragraph [ref=f19e314]: obtain an explanation about any decision taken as a result of automated decision-making and express your point of view regarding such decision;
          - listitem [ref=f19e315]:
            - paragraph [ref=f19e316]: challenge such a decision by asking us to reconsider a decision or take a new decision on a different basis; or
          - listitem [ref=f19e317]:
            - paragraph [ref=f19e318]: request and obtain human intervention on such processing.
      - paragraph [ref=f19e319]: Please contact us if you want to find out more about the purposes, the third-party services we use which makes automated decisions (if any), and any specific rationale for automated decisions used within the Applications.
    - generic [ref=f19e320]:
      - heading "Push notifications and email notifications" [level=4] [ref=f19e321]
      - paragraph [ref=f19e322]: The Applications may send you push notifications and we may send you email notifications to achieve the purposes outlined in this privacy policy. You may, in most cases, opt-out of receiving push notifications by visiting your device settings (such as the notification settings for mobile phones and then change those settings for the Applications).Note that disabling push notifications may negatively affect your use of the Applications.You may also, in most cases (except where we send you email notifications for the purposes set out in the table in section 4 above), opt-out of the email notifications we send by contacting us, clicking the “Unsubscribe” button at the end of our emails or by managing your communication preferences on the Applications.
    - generic [ref=f19e323]:
      - heading "5. Disclosures of your personal data" [level=2] [ref=f19e325]
      - generic [ref=f19e326]:
        - paragraph [ref=f19e327]: We may share your personal data with the parties set out below for the purposes set out in the table under the “purposes for which we will use your personal data” section above.
        - list [ref=f19e329]:
          - listitem [ref=f19e330]:
            - paragraph [ref=f19e331]: Third Parties as set out in the Glossary.
          - listitem [ref=f19e332]:
            - paragraph [ref=f19e333]: Third parties to whom we may choose to sell, transfer or merge parts of our business or our assets. Alternatively, we may seek to acquire other businesses or merge with them. If a change happens to our business, then the new owners may use your personal data in the same way as set out in this privacy policy.
        - paragraph [ref=f19e334]: We require all third parties to respect the security of your personal data and to treat it in accordance with the law. We do not allow our third-party service providers to use your personal data for their own purposes and only permit them to process your personal data for specified purposes and in accordance with our instructions.
    - generic [ref=f19e335]:
      - heading "6. International transfers" [level=2] [ref=f19e337]
      - generic [ref=f19e338]:
        - paragraph [ref=f19e339]:
          - text: Many of our external third parties are based outside the UK and/or the European Economic Area (“
          - strong [ref=f19e340]: EEA
          - text: "”) so their processing of your personal data will involve a transfer of data outside the UK and/or the EEA.Whenever we transfer your personal data out of the UK and/or the EEA, we ensure a similar degree of protection is afforded to it by ensuring at least one of the following safeguards is implemented:"
        - list [ref=f19e342]:
          - listitem [ref=f19e343]:
            - paragraph [ref=f19e344]: We will only transfer your personal data to countries that have been deemed to provide an adequate level of protection for personal data by the UK or the European Commission (as applicable).
          - listitem [ref=f19e345]:
            - paragraph [ref=f19e346]: If we transfer your personal data to any other country which is not subject to an adequacy decision of the UK or the European Commission (as applicable) regarding an adequate level of protection of personal data, we will ensure that there is a legal basis and, if required, a relevant safeguard method for such data transfer so that your personal data are treated in a manner that is consistent with, and respects the applicable laws and regulations on data protection in the UK or the EEA (as applicable).
          - listitem [ref=f19e347]:
            - paragraph [ref=f19e348]: Where we use certain service providers, we may use specific contracts approved by the UK or the European Commission (as applicable) which give personal data the same protection it has in the UK or the EEA (as applicable).
        - paragraph [ref=f19e349]: Please contact us if you want further information on the specific mechanism used by us when transferring your personal data out of the UK or the EEA.
    - generic [ref=f19e350]:
      - heading "7. Data security" [level=2] [ref=f19e352]
      - paragraph [ref=f19e354]: We have put in place appropriate security measures to prevent your personal data from being accidentally lost, used or accessed in an unauthorised way, altered or disclosed. In addition, we limit access to your personal data to those employees, agents, contractors and other third parties who have a business need to know. They will only process your personal data on our instructions and they are subject to a duty of confidentiality. We have put in place procedures to deal with any suspected personal data breach and will notify you and any applicable regulator of a breach where we are legally required to do so.
    - generic [ref=f19e355]:
      - heading "8. Data retention" [level=2] [ref=f19e357]
      - generic [ref=f19e358]:
        - heading "How long will you use my personal data for?" [level=4] [ref=f19e359]
        - paragraph [ref=f19e360]:
          - text: We will only retain your personal data for as long as reasonably necessary to fulfil the purposes we collected it for, including for the purposes of satisfying any legal, regulatory, tax, accounting or reporting requirements. We may retain your personal data for a longer period in the event of a complaint or if we reasonably believe there is a prospect of litigation in respect to our relationship with you.‍To determine the appropriate retention period for personal data, we consider the amount, nature and sensitivity of the personal data, the potential risk of harm from unauthorised use or disclosure of your personal data, the purposes for which we process your personal data and whether we can achieve those purposes through other means, and the applicable legal, regulatory, tax, accounting or other requirements.You can request details of our retention periods for different aspects of your personal data by contacting us. In some circumstances you can ask us to delete your data; see “your legal rights” section below for further information. Where we use universally unique identifiers (“
          - strong [ref=f19e361]: UUID
          - text: ”) for analytics purposes or for storing your preferences, a UUID is generated upon your installation of our programme(s). The UUID persists between our programme’s launches and updates, but it is lost when you delete our programme. A new UUID will be generated when you reinstall our programme.In some circumstances we will anonymise your personal data (so that it can no longer be associated with you) for research or statistical purposes, in which case we may use this information indefinitely without further notice to you. Where you are or have been a free-tier user and you have exercised your right to request erasure of your personal data used for the purposes of Development and Improvement Processing (e.g., after having deleted your account or upgraded to a paid-for subscription), where there is no other valid reason for us to retain it (e.g., to comply with law), we will delete any personal data used for that purpose. However, we may continue to use any information derived through the Development and Improvement Processing provided that it is deidentified, anonymised, and/or aggregated in such a manner that such information no longer identifies you, your content or any other person(s)
    - generic [ref=f19e362]:
      - heading "9. Your legal rights" [level=2] [ref=f19e364]
      - generic [ref=f19e365]:
        - paragraph [ref=f19e366]: "Under certain circumstances, you have rights under data protection laws in relation to your personal data.‍Broadly, you have the right to:"
        - list [ref=f19e368]:
          - listitem [ref=f19e369]:
            - paragraph [ref=f19e370]:
              - strong [ref=f19e371]: Request access
              - text: to your personal data (commonly known as a "data subject access request"). This enables you to receive a copy of the personal data we hold about you and to check that we are lawfully processing it.
          - listitem [ref=f19e372]:
            - paragraph [ref=f19e373]:
              - strong [ref=f19e374]: Request correction
              - text: of the personal data that we hold about you. This enables you to have any incomplete or inaccurate data we hold about you corrected, though we may need to verify the accuracy of the new data you provide to us.
          - listitem [ref=f19e375]:
            - paragraph [ref=f19e376]:
              - strong [ref=f19e377]: Request erasure
              - text: of your personal data. This enables you to ask us to delete or remove personal data where there is no good reason for us continuing to process it. You also have the right to ask us to delete or remove your personal data where you have successfully exercised your right to object to processing (see below), where we may have processed your information unlawfully or where we are required to erase your personal data to comply with local law. Note, however, that we may not always be able to comply with your request of erasure for specific legal reasons which will be notified to you, if applicable, at the time of your request.
          - listitem [ref=f19e378]:
            - paragraph [ref=f19e379]:
              - strong [ref=f19e380]: Object to processing
              - text: of your personal data where we are relying on a legitimate interest (or those of a third party) and there is something about your particular situation which makes you want to object to processing on this ground as you feel it impacts on your fundamental rights and freedoms. You also have the right to object where we are processing your personal data for direct marketing purposes. In some cases, we may demonstrate that we have compelling legitimate grounds to process your information which override your rights and freedoms.
          - listitem [ref=f19e381]:
            - paragraph [ref=f19e382]:
              - strong [ref=f19e383]: Request restriction of processing
              - text: "of your personal data. This enables you to ask us to suspend the processing of your personal data in the following scenarios:"
            - list [ref=f19e385]:
              - listitem [ref=f19e386]:
                - paragraph [ref=f19e387]: If you want us to establish the data's accuracy.
              - listitem [ref=f19e388]:
                - paragraph [ref=f19e389]: Where our use of the data is unlawful but you do not want us to erase it.
              - listitem [ref=f19e390]:
                - paragraph [ref=f19e391]: Where you need us to hold the data even if we no longer require it as you need it to establish, exercise or defend legal claims.
              - listitem [ref=f19e392]:
                - paragraph [ref=f19e393]: You have objected to our use of your data but we need to verify whether we have overriding legitimate grounds to use it.
          - listitem [ref=f19e394]:
            - paragraph [ref=f19e395]:
              - strong [ref=f19e396]: Request the transfer
              - text: of your personal data to you or to a third party. We will provide to you, or a third party you have chosen, your personal data in a structured, commonly used, machine-readable format. Note that this right only applies to automated information which you initially provided consent for us to use or where we used the information to perform a contract with you.
          - listitem [ref=f19e397]:
            - paragraph [ref=f19e398]:
              - strong [ref=f19e399]: Withdraw consent at any time
              - text: where we are relying on consent to process your personal data. However, this will not affect the lawfulness of any processing carried out before you withdraw your consent. If you withdraw your consent, we may not be able to provide certain services to you. We will advise you if this is the case at the time you withdraw your consent.
        - paragraph [ref=f19e400]: If you wish to exercise any of the rights set out above, please contact us.
        - paragraph [ref=f19e401]: If you are or have been a free-tier user and you wish to object and opt-out of the Development and Improvement Processing and associated use of your personal data contained in content uploaded to our Applications under your ‘Free’ subscription, you may do so at any time. However, if you do object and opt-out of the Development and Improvement Processing during the term of your ‘Free’ subscription, please note that you cannot continue to use our Applications under that ‘Free’ tier, and must either delete your account or upgrade to a paid-for subscription.
      - generic [ref=f19e402]:
        - heading "No fee usually required" [level=4] [ref=f19e403]
        - paragraph [ref=f19e404]: You will not have to pay a fee to access your personal data (or to exercise any of the other rights). However, we may charge a reasonable fee if your request is clearly unfounded, repetitive or excessive. Alternatively, we could refuse to comply with your request in these circumstances.
      - generic [ref=f19e405]:
        - heading "What we may need from you" [level=4] [ref=f19e406]
        - paragraph [ref=f19e407]: We may need to request specific information from you to help us confirm your identity and ensure your right to access your personal data (or to exercise any of your other rights). This is a security measure to ensure that personal data is not disclosed to any person who has no right to receive it. We may also contact you to ask you for further information in relation to your request to speed up our response.
      - generic [ref=f19e408]:
        - heading "Time limit to respond" [level=4] [ref=f19e409]
        - paragraph [ref=f19e410]: We try to respond to all legitimate requests within one month. Occasionally it could take us longer than a month if your request is particularly complex or you have made a number of requests. In this case, we will notify you and keep you updated.
    - generic [ref=f19e411]:
      - heading "10. Glossary" [level=2] [ref=f19e413]
      - generic [ref=f19e414]:
        - heading "LAWFUL BASIS" [level=4] [ref=f19e415]
        - paragraph [ref=f19e416]:
          - strong [ref=f19e417]: Legitimate Interest
          - text: means the interest of our business in conducting and managing our business to enable us to give you the best service and the best and most secure experience. We make sure we consider and balance any potential impact on you (both positive and negative) and your rights before we process your personal data for our legitimate interests. We do not use your personal data for activities where our interests are overridden by the impact on you (unless we have your consent or are otherwise required or permitted to by law). You can obtain further information about how we assess our legitimate interests against any potential impact on you in respect of specific activities by contacting us.
      - paragraph [ref=f19e419]:
        - strong [ref=f19e420]: Performance of Contract
        - text: means processing your data where it is necessary for the performance of a contract to which you are a party or to take steps at your request before entering into such a contract.
      - paragraph [ref=f19e422]:
        - strong [ref=f19e423]: Comply with a legal obligation
        - text: means processing your personal data where it is necessary for compliance with a legal obligation that we are subject to.
      - generic [ref=f19e424]:
