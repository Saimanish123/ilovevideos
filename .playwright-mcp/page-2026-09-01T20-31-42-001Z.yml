  - generic [ref=f19e55]:
    - heading "Privacy Policy" [level=1] [ref=f19e57]
    - paragraph [ref=f19e59]:
      - text: Veed Limited (“
      - strong [ref=f19e60]: Veed
      - text: ”) respects your privacy and is committed to protecting your personal data. This privacy policy will inform you as to how we look after your personal data when you visit our website(s) (including subdomains of our website(s) and websites through which we make our services available) and/or our applications for mobile, tablet, desktop, browser and other smart device systems (“
      - strong [ref=f19e61]: Applications
      - text: "”) (regardless of where you visit it from) and use our services, and tell you about your privacy rights and how the law protects you.By using the Applications or our services, you agree to be bound by this privacy policy and that we proceed to the processing of personal data on the terms outlined below.The Privacy Policy last updated on: 6"
      - superscript [ref=f19e62]: th
      - text: of January, 2025
    - generic [ref=f19e63]:
      - paragraph [ref=f19e64]: Please use the Glossary to understand the meaning of some of the terms used in this privacy policy.
      - generic [ref=f19e65]:
        - heading "1. Important information and who we are" [level=2] [ref=f19e67]
        - generic [ref=f19e68]:
          - heading "Purpose of this privacy policy" [level=4] [ref=f19e69]
          - paragraph [ref=f19e70]:
            - text: This privacy policy aims to give you information on how Veed collects and processes your personal data through your use of the Applications and our services, including any data you may provide through the Applications (for example, when you chat with us on our “support chat” function available through our website (
            - link [ref=f19e71] [cursor=pointer]:
              - /url: https://www.veed.io
              - emphasis [ref=f19e72]: www.veed.io
            - text: )), create an account with us, purchase a service or upload and edit audio or video files. The Applications are not intended for children and we do not knowingly collect data relating to children.It is important that you read this privacy policy together with any other privacy policy or fair processing policy we may provide on specific occasions when we are collecting or processing personal data about you so that you are fully aware of how and why we are using your data. This privacy policy supplements other notices and privacy policies and is not intended to override them.
        - generic [ref=f19e73]:
          - heading "Controller" [level=4] [ref=f19e74]
          - paragraph [ref=f19e75]: Veed Limited (collectively referred to as “Veed”, "we", "us" or "our" in this privacy policy) is the controller and responsible for your personal data, except where we process your personal data because you use our services as a result of your relationship with a customer who we supply our services to (for example, if you use our services as a result of your being our customer’s employee or client). We have appointed a data privacy manager who is responsible for overseeing questions in relation to this privacy policy. If you have any questions about this privacy policy, including any requests to exercise your legal rights, please contact the data privacy manager using the details set out below. Where we process your personal data because you use our services as a result of your relationship with a customer who we supply our services to, we are not the data controller as we would be processing personal data on behalf of our customer as a data processor. Where we are processing your personal data on behalf of our customer, the privacy policy that you should be referring to would be our customer’s privacy policy. Our customer’s privacy policy should inform you as to how your personal data will be processed.
        - generic [ref=f19e76]:
          - heading "Contact details" [level=4] [ref=f19e77]
          - paragraph [ref=f19e78]:
            - text: "If you have any questions about this privacy policy or our privacy practices, please contact our data privacy manager in the following ways:Full name of legal entity: Veed LimitedEmail address: hello@veed.ioPostal address: 17-18 Clere Street, Shoreditch, London EC2A 4LJYou have the right to make a complaint at any time to the Information Commissioner's Office (ICO), the UK regulator for data protection issues ("
            - emphasis [ref=f19e79]: www.ico.org.uk
            - text: ). We would, however, appreciate the chance to deal with your concerns before you approach the ICO so please contact us in the first instance.
        - generic [ref=f19e80]:
          - heading "Changes to the privacy policy and your duty to inform us of changes" [level=4] [ref=f19e81]
          - paragraph [ref=f19e82]: We keep our privacy policy under regular review. Historic versions can be obtained by contacting us.It is important that the personal data we hold about you is accurate and current. Please keep us informed if your personal data changes during your relationship with us.
        - generic [ref=f19e83]:
          - heading "Third-party links" [level=4] [ref=f19e84]
          - paragraph [ref=f19e85]: The Applications may include links to third-party websites, plug-ins and applications. Clicking on those links or enabling those connections may allow third parties to collect or share data about you. We do not control these third-party websites and are not responsible for their privacy statements. When you leave the Applications, we encourage you to read the privacy policy of every website you visit.
      - generic [ref=f19e86]:
        - heading "2. The personal data we collect about you" [level=2] [ref=f19e88]
        - generic [ref=f19e89]:
          - paragraph [ref=f19e90]: "Personal data, or personal information, means any information about an individual from which that person can be identified. It does not include data where the identity has been removed (anonymous data).We may collect, use, store and transfer different kinds of personal data about you which we have grouped together as follows:"
          - list [ref=f19e92]:
            - listitem [ref=f19e93]:
              - paragraph [ref=f19e94]:
                - strong [ref=f19e95]: Identity Data
                - text: includes first name, maiden name, last name, username or similar identifier, marital status, title, date of birth, gender and, if you are in a video or audio file that is uploaded to the Applications, visual and/or audio identifiers.
            - listitem [ref=f19e96]:
              - paragraph [ref=f19e97]:
                - strong [ref=f19e98]: Contact Data
                - text: includes billing address, email address and telephone numbers.
            - listitem [ref=f19e99]:
              - paragraph [ref=f19e100]:
                - strong [ref=f19e101]: Financial Data
                - text: includes bank account and payment card details.
            - listitem [ref=f19e102]:
              - paragraph [ref=f19e103]:
                - strong [ref=f19e104]: Transaction Data
                - text: includes details about payments to and from you and other details of services you have purchased from us.
            - listitem [ref=f19e105]:
              - paragraph [ref=f19e106]:
                - strong [ref=f19e107]: Technical Data
                - text: includes internet protocol (IP) address, your login data, browser type and version, time zone setting and location, browser plug-in types and versions, operating system and platform, other technology on the devices you use to access the Applications, and information in or about the audio or video files you provide (including metadata), such as the location of a video or the date it was created.
            - listitem [ref=f19e108]:
              - paragraph [ref=f19e109]:
                - strong [ref=f19e110]: Profile Data
                - text: includes your username and password, purchases or orders made by you, your interests, preferences, feedback and survey responses.
            - listitem [ref=f19e111]:
              - paragraph [ref=f19e112]:
                - strong [ref=f19e113]: Usage Data
                - text: includes information about how you use the Applications and services.
            - listitem [ref=f19e114]:
              - paragraph [ref=f19e115]:
                - strong [ref=f19e116]: Marketing and Communications Data
                - text: includes your preferences in receiving marketing from us and our third parties and your communication preferences.
          - paragraph [ref=f19e117]:
            - text: We also collect, use and share
            - strong [ref=f19e118]: Aggregated Data
            - text: such as statistical or demographic data for any purpose. Aggregated Data could be derived from your personal data but is not considered personal data in law as this data will
            - strong [ref=f19e119]: not
            - text: directly or indirectly reveal your identity. For example, we may aggregate your Usage Data to calculate the percentage of users accessing a specific website feature. However, if we combine or connect Aggregated Data with your personal data so that it can directly or indirectly identify you, we treat the combined data as personal data which will be used in accordance with this privacy policy.We do not ask you for any
            - strong [ref=f19e120]: Special Categories of Personal Data
            - text: about you (this includes details about your race or ethnicity, religious or philosophical beliefs, sex life, sexual orientation, political opinions, trade union membership, information about your health, and genetic and biometric data). Nor do we ask you for any information about criminal convictions and offences. You may choose to provide us with Special Categories of Personal Data through your uploading of video or audio files or other data on to the Applications. Where you provide us with such Special Categories of Personal Data, you are giving us your explicit consent to process such data about you to the extent permitted by the UK and/or EU data protection regime (as applicable). Where you provide us with such Special Categories of Personal Data about persons other than yourself, you must obtain each of their explicit written consent for us to process their Special Categories of Personal Data to the extent permitted by the UK and/or EU data protection regime (as applicable) and in accordance with this privacy policy. Their explicit written consent which you obtain must be supplied to us on our request. If a person does not give explicit written consent to our processing their Special Categories of Personal Data, then their Special Categories of Personal Data must not be supplied to us. That is to say, you must not upload video or audio files containing Special Categories of Personal Data of anyone who you have not obtained explicit written consent from. Special Categories of Personal Data are subject to special protections under the UK and/or the EU data protection regime (as applicable).
        - generic [ref=f19e121]:
          - heading "If you fail to provide personal data" [level=4] [ref=f19e122]
          - paragraph [ref=f19e123]: Where we need to collect personal data by law, or under the terms of a contract we have with you, and you fail to provide that data when requested, we may not be able to perform the contract we have or are trying to enter into with you (for example, to provide you with services). In this case, we may have to cancel a service you have with us but we will notify you if this is the case at the time.
      - generic [ref=f19e124]:
        - heading "3. How is your personal data collected?" [level=2] [ref=f19e126]
        - generic [ref=f19e127]:
          - paragraph [ref=f19e128]: "We use different methods to collect data from and about you including through:"
          - list [ref=f19e130]:
            - listitem [ref=f19e131]:
              - paragraph [ref=f19e132]:
                - strong [ref=f19e133]: Direct interactions.
                - text: "You may give us Identity, Contact and Financial Data by filling in forms or by corresponding with us by post, phone, email or otherwise. This includes personal data you provide when you:"
              - list [ref=f19e135]:
                - listitem [ref=f19e136]:
                  - paragraph [ref=f19e137]: apply for our services;
                - listitem [ref=f19e138]:
                  - paragraph [ref=f19e139]: upload audio or video files on the Applications;
                - listitem [ref=f19e140]:
                  - paragraph [ref=f19e141]: create an account on the Applications;
                - listitem [ref=f19e142]:
                  - paragraph [ref=f19e143]: subscribe to our service or publications;
                - listitem [ref=f19e144]:
                  - paragraph [ref=f19e145]: request marketing to be sent to you;
                - listitem [ref=f19e146]:
                  - paragraph [ref=f19e147]: enter a survey;
                - listitem [ref=f19e148]:
                  - paragraph [ref=f19e149]: give us feedback or contact us; or
                - listitem [ref=f19e150]:
                  - paragraph [ref=f19e151]: participate in programs, forums or groups we may invite you to join.
            - listitem [ref=f19e152]:
              - paragraph [ref=f19e153]:
                - strong [ref=f19e154]: Automated technologies or interactions.
                - text: As you interact with the Applications, we will automatically collect Technical Data about your equipment, browsing actions and patterns. We collect this personal data by using cookies, server logs and other similar technologies. We may also receive Technical Data about you if you visit other websites employing our cookies. Please see our
                - link "cookie policy" [ref=f19e155] [cursor=pointer]:
                  - /url: /cookie-policy
                - text: for further details.
            - listitem [ref=f19e156]:
              - paragraph [ref=f19e157]:
                - strong [ref=f19e158]: Third parties or publicly available sources.
                - text: "We will receive personal data about you from various third parties and public sources as set out below:"
              - list [ref=f19e160]:
                - listitem [ref=f19e161]:
                  - paragraph [ref=f19e162]: "Technical Data from the following parties:"
                  - list [ref=f19e164]:
                    - listitem [ref=f19e165]:
                      - paragraph [ref=f19e166]: analytics providers;
                    - listitem [ref=f19e167]:
                      - paragraph [ref=f19e168]: advertising networks; and
                    - listitem [ref=f19e169]:
                      - paragraph [ref=f19e170]: search information providers.
                - listitem [ref=f19e171]:
                  - paragraph [ref=f19e172]: Contact, Financial and Transaction Data from providers of technical and payment services.
                - listitem [ref=f19e173]:
                  - paragraph [ref=f19e174]: Identity and Contact Data from data brokers or aggregators.
                - listitem [ref=f19e175]:
                  - paragraph [ref=f19e176]: Identity and Contact Data from publicly available sources such as Companies House and the Electoral Register based inside the UK.
      - generic [ref=f19e177]:
        - heading "4. How we use your personal data" [level=2] [ref=f19e179]
        - generic [ref=f19e180]:
          - paragraph [ref=f19e181]: "We will only use your personal data when the law allows us to. Most commonly, we will use your personal data in the following circumstances:"
          - list [ref=f19e183]:
            - listitem [ref=f19e184]:
              - paragraph [ref=f19e185]: Where we need to perform the contract we are about to enter into or have entered into with you.
            - listitem [ref=f19e186]:
              - paragraph [ref=f19e187]: Where it is necessary for our legitimate interests (or those of a third party) and your interests and fundamental rights do not override those interests.
            - listitem [ref=f19e188]:
              - paragraph [ref=f19e189]: Where we need to comply with a legal obligation.
          - paragraph [ref=f19e190]: The types of lawful bases that we will rely on to process your personal data is set out in the Glossary.Generally, we do not rely on consent as a legal basis for processing your personal data, save for the processing of Special Categories of Personal Data (where applicable) and our making automated decisions (where applicable), although we will get your consent before sending third party direct marketing communications to you via email or text message. You have the right to withdraw consent to marketing at any time by contacting us. We do not sell your personal data to third parties.
          - generic [ref=f19e191]:
            - heading "Purposes for which we will use your personal data" [level=4] [ref=f19e192]
            - paragraph [ref=f19e193]: We have set out below, in a table format, a description of all the ways we plan to use your personal data, and which of the legal bases we rely on to do so. We have also identified what our legitimate interests are where appropriate.Note that we may process your personal data for more than one lawful ground depending on the specific purpose for which we are using your data. Please contact us if you need details about the specific legal ground we are relying on to process your personal data where more than one ground has been set out in the table below.
