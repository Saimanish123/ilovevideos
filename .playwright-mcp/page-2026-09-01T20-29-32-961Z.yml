      - heading "Frequently asked questions (and answers)" [level=2] [ref=f35e140]
      - generic [ref=f35e141]:
        - generic [ref=f35e142]:
          - heading "Will you do a pre-sales call or live demo for us?" [level=4] [ref=f35e143]
          - paragraph [ref=f35e144]:
            - text: We unfortunately don't offer live demos or do calls in our sales process. That said, our software is ridiculously easy to use and you can watch a
            - link "10 minute video demo" [ref=f35e145] [cursor=pointer]:
              - /url: /video/dashboard-walkthrough
            - text: or click around on
            - link "our live demo" [ref=f35e146] [cursor=pointer]:
              - /url: https://app.usefathom.com/demo
            - text: . Every
            - link "feature is documented" [ref=f35e147] [cursor=pointer]:
              - /url: /docs
            - text: and you can even give our software a 7-day free trial (run it alongside your existing analytics). Of course, if you need help or have specific questions, we're here
            - link "via email" [ref=f35e148] [cursor=pointer]:
              - /url: /about/contact
            - text: ", just let us know how we can be of assistance."
        - generic [ref=f35e149]:
          - heading "Do you have a lower/free option?" [level=4] [ref=f35e150]
          - paragraph [ref=f35e151]: "Nope, and here's why: we've heavily invested in enterprise-level infrastructure with great speed and reliability (we don't just host our software on cheap VPS servers that go offline). Our business model is selling software, not your data. So we've priced for long-term sustainability of our company. That way we can offer our product for a very long time (forever)."
        - generic [ref=f35e152]:
          - heading "Do you ever do sales or discounts?" [level=4] [ref=f35e153]
          - paragraph [ref=f35e154]: Never. Not even for Black Friday. So rest assured, the price you are seeing today or are paying in your account currently is the best price EVER. We've never done discounts, nor will we ever. We feel this is fair, because everyone pays the exact same price.
        - generic [ref=f35e155]:
          - heading "What happens if I hit my pageview limit?" [level=4] [ref=f35e156]
          - paragraph [ref=f35e157]: We'll never turn your analytics off for occasional traffic spikes or if a payment fails the first time (hey, this has happened to all of us at least once). Instead, if you go over for two months in a row, we'll let you know we're upgrading you. From there, you can decide to stay or cancel your account (no hard feelings either way).
        - generic [ref=f35e158]:
          - heading "Can I switch to a different pageview limit?" [level=4] [ref=f35e159]
          - paragraph [ref=f35e160]: Of course! If you exceed your pageview limits for two months in a row, we'll offer to do that for you. Or, if you're under your current tier for two months in a row (and it's not our lowest tier already), you can downgrade from within our billing settings.
        - generic [ref=f35e161]:
          - heading "How many sites does my plan include?" [level=4] [ref=f35e162]
          - paragraph [ref=f35e163]:
            - text: Every plan includes at least 50 sites, and the bigger pageview plans include more (75 on the 1M plan, scaling up to hundreds on the largest plans). You'll see the exact number for each plan in the
            - link "pricing table" [ref=f35e164] [cursor=pointer]:
              - /url: "#pricing"
            - text: . If you need more than your plan includes, you can add sites yourself in packs of 50 for $10/month each (or $100/year, which gets you two months free) from your billing settings. You can add up to 15 packs (750 extra sites) yourself. Need more than that?
            - link "Get in touch" [ref=f35e165] [cursor=pointer]:
              - /url: /about/contact
            - text: and we'll sort you out.
        - generic [ref=f35e166]:
          - heading "What if I want to cancel my account or trial?" [level=4] [ref=f35e167]
          - paragraph [ref=f35e168]: We're not interested in having someone's money if they aren't happy. So if you want to cancel your account at any point, you can do so right from your settings - you don't even have to call or email us (unless you have a question). There are no contracts, meaning you can cancel anytime (with a complete data export).
        - generic [ref=f35e169]:
          - heading "Does custom event tracking count as pageviews?" [level=4] [ref=f35e170]
          - paragraph [ref=f35e171]: Yes. If you decide to use our custom event tracking system on your website or use our API, those requests will be counted as if they were pageviews.
        - generic [ref=f35e172]:
          - heading "What if I have another question?" [level=4] [ref=f35e173]
          - paragraph [ref=f35e174]:
            - link "Reach out" [ref=f35e175] [cursor=pointer]:
              - /url: /about/contact
            - text: "! We will be happy to help with any pre-sales questions."
